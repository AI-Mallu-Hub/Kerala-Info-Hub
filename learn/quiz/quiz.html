<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cell Quiz</title>

<link rel="stylesheet"
href="css/quiz.css">

</head>

<body>
    
    <header class="quiz-header">

<a href="../anatomy/cell/index.html" class="back-btn">
    ← Back to Lesson
</a>

<h1>🧫 Cell Quiz</h1>

<p>

Test your understanding of this lesson.

</p>

</header>

<div id="quizArea">

<section class="quiz-progress">

<div>

Question

<span id="questionNumber">

1

</span>

/10

</div>

<div class="progress-bar">

<div
id="progressFill"
class="progress-fill">

</div>

</div>

</section>

<section class="question-card">

<h2 id="questionText">

Question goes here

</h2>

<div id="optionsContainer">

</div>

</section>

<div class="quiz-actions">

<button
id="submitBtn">

Submit

</button>

</div>

<section
id="explanationCard"

class="hidden">

<h2>

💡 Explanation

</h2>

<p id="explanation">

</p>

<div class="clinical">

🩺

<span id="clinical">

</span>

</div>

<div class="exam-tip">

💡

<span id="examTip">

</span>

</div>

</section>

</div>

<div id="resultScreen" class="result-screen" style="display:none;">

    <div class="result-card">

        <h2>🎉 Quiz Completed</h2>

        <h3 id="finalScore">
            0 / 10
        </h3>

        <p id="finalPercentage">
            0%
        </p>

        <p id="performanceMessage"></p>
        <div id="performanceBadge" class="performance-badge"></div>

        <button id="retryBtn">
            🔄 Retry Quiz
        </button>

        <button id="reviewBtn">
    📖 Review Answers
        </button>

        <button id="backLessonBtn">
            📚 Back to Lesson
        </button>

    </div>

</div>
    
    <section id="reviewScreen" class="hidden">

    <h2>📖 Review Answers</h2>

    <div id="reviewContainer">

    </div>

    <button id="closeReviewBtn">
        ✖ Close Review
    </button>

    </section>
    

</section>

    
<script src="js/lesson-quiz-engine.js"></script>

</body>
</html>
